services:
  vectordb:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    volumes:
      - vector-data:/qdrant/storage
    # Not published on the host. Only the API talks to it.
    expose:
      - "6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # These win over anything in .env, because inside the stack the paths and
      # the vector store address are fixed.
      DATA_DIR: /data
      QDRANT_URL: http://vectordb:6333
      # Same origin behind nginx, so no cross origin allowance is needed.
      CORS_ORIGINS: ""
    volumes:
      - app-data:/data
    depends_on:
      vectordb:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  # Uploaded files and the SQLite database.
  app-data:
  # Qdrant collections.
  vector-data:
